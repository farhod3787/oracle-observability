services:
  oracle-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oracle-exporter
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9161:9161"
    # Enables connecting to an Oracle instance running on the host OS via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - observability-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: oracle-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - oracle-exporter
    networks:
      - observability-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: oracle-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/oracle_overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - observability-net

networks:
  observability-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
