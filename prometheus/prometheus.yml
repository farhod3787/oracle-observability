global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "oracle-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["oracle-exporter:9161"]
        labels:
          environment: "production"
          service: "oracle-database"
